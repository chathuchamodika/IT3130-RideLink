spring.application.name=fare-payment-service
server.port=8084

# MongoDB - env var required in CI/prod; localhost default is for local dev only (no secret)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/fare_payment_db}
# creates the @Indexed(unique) indexes (rideId idempotency) on startup
spring.data.mongodb.auto-index-creation=true

# JWT issued by the Account Service (RS256 + JWKS endpoint)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI:http://localhost:8081/oauth/jwks}

# Optional synchronous verification against the Ride Management Service
ridelink.ride-service.enabled=${RIDE_SERVICE_ENABLED:false}
ridelink.ride-service.base-url=${RIDE_SERVICE_BASE_URL:http://localhost:8083/api/v1}

# Fare rule defaults live in FareProperties; override here if needed, e.g.:
# ridelink.fare.base-fare=150.00

springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info